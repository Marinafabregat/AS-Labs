{% extends "base.html" %}

{% block title %}VINSEC - Publish product{% endblock %}

{% block content %}
<main class="max-w-xl mx-auto my-10 p-4">
    <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200">
        <div class="border-b border-slate-100 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Sell a product</h1>
            <p class="text-slate-500 text-sm mt-1">Fill out the form to sell a product.</p>
        </div>

        {% if error %}
            <div class="bg-rose-100 border border-rose-400 text-rose-700 px-4 py-3 rounded-xl mb-6 text-sm font-medium">
                {{ error }}
            </div>
        {% endif %}

        <form action="/items/create" method="POST" enctype="multipart/form-data" class="space-y-5">
            
            <!-- Field: Title -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Product Title</label>
                <input type="text" name="title" required placeholder="Ej.Nike Air Shoes" 
                       class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition">
            </div>

            <!-- Field: Description -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Description</label>
                <textarea name="description" rows="3" required placeholder="Describe item, size, color..." 
                          class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition"></textarea>
            </div>

            <!-- Price and Category Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Price (€)</label>
                    <input type="number" step="0.01" min="0" name="price" required placeholder="25.00" 
                           class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Category</label>
                    <select name="category_id" required 
                            class="w-full border border-slate-300 rounded-xl px-4 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition">
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Product photo (Mandatory)</label>
                <input type="file" name="image" accept="image/*" required 
                       class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200">
                + Publish item
            </button>
        </form>
    </div>
</main>
{% endblock %}
