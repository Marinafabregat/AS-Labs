{% extends "base.html" %}

{% block title %}Register - VINSEC Marketplace{% endblock %}

{% block content %}
<!-- Centered Card Container for Registration Form -->
<div class="max-w-md mx-auto my-10">
    <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200">
        
        <!-- Form Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900">Create an Account</h1>
            <p class="text-slate-500 text-sm mt-1">Join VINSEC to buy and sell pre-loved items securely.</p>
        </div>

        <!-- Error Alert: Username/Email already in use -->
        {% if error %}
            <div class="bg-rose-100 border border-rose-400 text-rose-700 px-4 py-3 rounded-xl mb-6 text-sm font-medium text-center">
                {{ error }}
            </div>
        {% endif %}

        <!-- Registration Form -->
        <form action="/users/register" method="POST" class="space-y-4">
            
            <!-- Username Input -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" value="{{ username or '' }}" required placeholder="Choose a unique username"
                       class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition">
            </div>

            <!-- Email Input -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" value="{{ email or '' }}" required placeholder="your.email@example.com"
                       class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition">
            </div>

            <!-- Delivery Address (Optional)  REMOVED 
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Delivery Address <span class="text-slate-400 font-normal">(Optional)</span></label>
                <input type="text" name="delivery_address" placeholder="123 Main St, City, Country"
                       class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition">
            </div> -->

            <!-- Password Input -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="Choose a strong password"
                       class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent transition">
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition mt-2">
                Create Account
            </button>
        </form>

        <!-- Redirect to Login -->
        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <p class="text-sm text-slate-600">
                Already have an account? 
                <a href="/users/login" class="font-bold text-emerald-700 hover:underline">Log in here</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
