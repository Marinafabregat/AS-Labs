{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<h2>Create Account</h2>

{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}

<form method="post" action="/users/register">
  <div>
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" value="{{ username or '' }}" required>
  </div>
  
  <div>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required>
  </div>
  
  <div>
    <label for="delivery_address">Delivery Address (Optional):</label>
    <input type="text" id="delivery_address" name="delivery_address" placeholder="123 Main St, City, Country">
  </div>
  
  <div>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
  </div>
  
  <button type="submit">Register</button>
</form>

<p>Already have an account? <a href="/users/login">Login here</a>.</p>
{% endblock %}
