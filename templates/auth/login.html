{% extends "base.html" %}
{% block title %}Login - VINSEC Marketplace{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200">

        <!-- Form Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-900">Sign In</h1>
            <p class="text-slate-500 text-sm mt-1">Access your VINSEC marketplace account.</p>
        </div>

        <!-- Error Alert -->
        {% if error %}
            <div class="bg-rose-100 border border-rose-400 text-rose-700 px-4 py-3 rounded-xl mb-6 text-sm font-medium text-center">
                {{ error }}
            </div>
        {% endif %}

        <!-- Google OAuth -->
        <a href="/auth/google"
           class="flex items-center justify-center gap-3 w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm transition">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Sign in with Google
        </a>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-6">
            <span class="flex-1 h-px bg-slate-200"></span>
            <span class="text-xs font-medium text-slate-400 uppercase">or</span>
            <span class="flex-1 h-px bg-slate-200"></span>
        </div>

        <!-- Password Login -->
        <a href="/users/login"
           class="flex items-center justify-center w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition">
            Sign in with Password
        </a>

        <!-- Redirect to Registration -->
        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <p class="text-sm text-slate-600">
                Don't have an account?
                <a href="/users/register" class="font-bold text-emerald-700 hover:underline">Register here</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
