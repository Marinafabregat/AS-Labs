services:
  app:
    build: .
    container_name: vinsec-app
    volumes:
      - .:/app/project
      - ./.env:/app/project/.env:ro
    env_file:
      - .env
    environment:
      # Inside the Docker network, AuthzForce is reached by its service name.
      # localhost would point to the app container itself.
      - AUTHZFORCE_BASE_URL=http://authzforce:8080/authzforce-ce
    depends_on:
      authzforce:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  authzforce:
    image: fiware/authzforce-ce-server:12.0.1
    container_name: authzforce
    ports:
      - "8080:8080"
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["security"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./zap:/zap/wrk:rw
    command: ["zap.sh", "-cmd", "-autorun", "/zap/wrk/zap-plan.yaml"]
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: vinsec-nginx
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped