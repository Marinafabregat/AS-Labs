version: '3.8'

services:
  app:
    build: .
    container_name: vinsec-app
    volumes:
      - .:/app/project
      - ./.env:/app/project/.env:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["security"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./zap:/zap/wrk:rw
    command: ["zap.sh", "-cmd", "-autorun", "/zap/wrk/zap-plan.yaml"]
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: vinsec-nginx
    ports:
      - "80:80"       # Standard HTTP (redirects to HTTPS)
      - "443:443"     # Standard HTTPS
      - "8000:8000"   # Custom HTTPS port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped